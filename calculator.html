<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Car Installments Calculator</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-dark bg-dark shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">Car Installments Calculator</a>
    </div>
  </nav>

  <!-- Main Calculator Card -->
  <div class="container my-5">
    <div class="row justify-content-center">
      <div class="col-md-8 col-lg-6">
        <div class="card shadow-sm border-0">
          
          <div class="card-header bg-primary text-white text-center py-3">
            <h4 class="mb-0 fw-bold">Car Installments Calculator</h4>
          </div>

          <div class="card-body p-4">
            <form>
              
              <!-- Car Type -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Car Type</label>
                <input type="text" class="form-control" placeholder="e.g., Toyota">
              </div>

              <!-- Car Model -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Car Model</label>
                <input type="text" class="form-control" placeholder="e.g., Corolla 2024">
              </div>

              <!-- Car Price -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Car Price (EGP)</label>
                <input type="text" class="form-control" placeholder="Enter total price (e.g., 850000)">
              </div>

              <!-- Down Payment -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Down Payment (EGP)</label>
                <input type="text" class="form-control" placeholder="Enter down payment (e.g., 200000)">
              </div>

              <!-- Installment Duration -->
              <div class="mb-3">
                <label class="form-label fw-semibold">Installment Plan</label>
                <select class="form-select">
                  <option selected disabled>Select duration...</option>
                  <option value="12">12 Months (1 Year)</option>
                  <option value="24">24 Months (2 Years)</option>
                  <option value="36">36 Months (3 Years)</option>
                  <option value="60">60 Months (5 Years)</option>
                </select>
              </div>

              <!-- Calculate Button -->
              <button type="button" class="btn btn-primary w-100 py-2 mt-3 fw-bold">Calculate Installment</button>

            </form>

            <hr class="my-4">

            <!-- Calculation Results Section -->
            <div class="bg-light p-3 rounded border">
              <h5 class="text-secondary mb-3 fw-bold">Calculation Results</h5>
              
              <div class="row g-2">
                <div class="col-6">
                  <div class="p-3 border rounded bg-white text-center">
                    <small class="text-muted d-block fw-semibold">Monthly Payment</small>
                    <strong class="text-success fs-5">0.00 EGP</strong>
                  </div>
                </div>
                <div class="col-6">
                  <div class="p-3 border rounded bg-white text-center">
                    <small class="text-muted d-block fw-semibold">Interest Rate</small>
                    <strong class="text-info fs-5">0%</strong>
                  </div>
                </div>
              </div>

            </div>

          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
